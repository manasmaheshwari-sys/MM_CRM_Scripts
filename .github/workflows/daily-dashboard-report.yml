name: SD New Flow Dashboard — Daily Report

# GitHub's `schedule:` is best-effort: it drops or delays most ticks (a 6-slot
# cron fired ~2x/day, hours off; 15-min ticks still only delivered a few a day).
# So the slot timing no longer depends on cron delivery. ONE job stays alive for
# ~5h20m (dashboard_runner_loop.sh) and checks every 2 minutes whether a refresh
# is due — target slots 11:00, 13:00, 15:00, 17:00, 18:00, 19:00 IST, served at
# most once each, judged by the dashboard's own "Last updated" stamp. When its
# window ends it dispatches its own successor, so the chain runs all day and
# night. The slow cron below is only a safety net that restarts the chain if it
# ever breaks (a crash, a cancelled run). Public repo => runner minutes are free.
on:
  schedule:
    - cron: "17 */3 * * *" # safety net only (UTC), off the top of the hour
  workflow_dispatch: # start/restart the chain manually

# Needed so the job can dispatch its successor with the built-in token.
permissions:
  contents: read
  actions: write

# One runner chain at a time. A newer queued run replaces an older queued one,
# so ticks and hand-offs never pile up.
concurrency:
  group: dashboard-runner
  cancel-in-progress: false

jobs:
  run-daily-report:
    runs-on: ubuntu-latest
    timeout-minutes: 350 # hard cap under GitHub's 6h job limit; loop hands over at 5h20m
    steps:
      - name: Checkout repository code
        uses: actions/checkout@v4

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install Node dependencies
        run: npm ci

      - name: Install Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      # Scripts read ./service_account_key.json at the repo root. The key lives
      # only in the FIREBASE_KEY secret and is deleted again at the end.
      - name: Create Firebase/Sheets service account file
        env:
          SERVICE_ACCOUNT_KEY: ${{ secrets.FIREBASE_KEY }}
        run: echo "$SERVICE_ACCOUNT_KEY" > service_account_key.json

      # CI=true (set by GitHub) makes run_daily_report.js skip the Windows-only
      # Excel recalc step; Google Sheets recalculates formulas itself on import.
      - name: Run the refresh loop (checks every 2 min, refreshes when a slot is due)
        run: bash dashboard_runner_loop.sh

      - name: Hand over to the next run
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run daily-dashboard-report.yml --ref "${{ github.ref_name }}"

      - name: Clean up service account key
        if: always()
        run: rm -f service_account_key.json
