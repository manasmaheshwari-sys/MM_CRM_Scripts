name: SD New Flow Dashboard — Daily Report

# GitHub's `schedule:` is best-effort: it drops or delays most ticks (this
# workflow's old 6-slot cron fired ~2x/day, hours off). So instead of 6 exact
# cron slots, tick every ~15 min through the working window and let
# should_run_refresh.js decide whether a refresh is actually due:
#   - target slots are 11:00, 13:00, 15:00, 17:00, 18:00, 19:00 IST
#   - it runs only if the latest slot has started (<= 90 min ago) AND the
#     dashboard's own "Last updated" stamp is older than that slot
# so each slot is served once, by whichever runner gets there first (this
# workflow, the Windows scheduled task, or a manual run), and ticks outside
# the window or after a slot is served finish in seconds without refreshing.
# Cron is UTC (IST = UTC+5:30); minutes are off the top of the hour to dodge
# GitHub's start-of-hour load. 05:07-14:52 UTC = 10:37-20:22 IST.
on:
  schedule:
    - cron: "7,22,37,52 5-14 * * *"
  workflow_dispatch: # manual runs always refresh, no gate

concurrency:
  group: dashboard-refresh
  cancel-in-progress: false

jobs:
  run-daily-report:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout repository code
        uses: actions/checkout@v4

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install Node dependencies
        run: npm ci

      # Scripts read ./service_account_key.json at the repo root. The key lives
      # only in the FIREBASE_KEY secret and is deleted again at the end.
      - name: Create Firebase/Sheets service account file
        env:
          SERVICE_ACCOUNT_KEY: ${{ secrets.FIREBASE_KEY }}
        run: echo "$SERVICE_ACCOUNT_KEY" > service_account_key.json

      - name: Decide whether a refresh is due
        id: gate
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "Manual run — always refreshing"
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            node should_run_refresh.js
          fi

      - name: Install Python
        if: steps.gate.outputs.run == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install Python dependencies
        if: steps.gate.outputs.run == 'true'
        run: pip install -r requirements.txt

      # CI=true (set by GitHub) makes run_daily_report.js skip the Windows-only
      # Excel recalc step; Google Sheets recalculates formulas itself on import.
      - name: Run the daily report
        if: steps.gate.outputs.run == 'true'
        run: node run_daily_report.js

      - name: Clean up service account key
        if: always()
        run: rm -f service_account_key.json
