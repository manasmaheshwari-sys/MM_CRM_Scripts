name: Sales Team Daily Report

on:
  schedule:
    # 01:30 UTC = 07:00 IST, reports on the previous IST day
    - cron: "30 1 * * *"
  workflow_dispatch:
    inputs:
      date:
        description: "Optional IST date (YYYY-MM-DD) to report on; default is yesterday"
        required: false

jobs:
  report:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: npm ci || npm install
      - name: Write service account keys
        env:
          FIREBASE_KEY: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
        run: printf '%s' "$FIREBASE_KEY" > service_account_key.json
      - name: Run report
        run: node sales_team_daily_report.js ${{ github.event.inputs.date }}
      - name: Remove keys
        if: always()
        run: rm -f service_account_key.json
