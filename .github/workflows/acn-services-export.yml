name: Daily ACN Services Export

on:
  schedule:
    - cron: "30 14 * * *" # 14:30 UTC = 20:00 IST
  workflow_dispatch: {}

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install dependencies
        run: npm ci

      - name: Write service account key
        env:
          SERVICE_ACCOUNT_KEY: ${{ secrets.FIREBASE_KEY }}
        run: echo "$SERVICE_ACCOUNT_KEY" > service_account_key.json

      - name: Run ACN services export
        run: node ACN/export_acn_services.js

      - name: Clean up service account key
        if: always()
        run: rm -f service_account_key.json
